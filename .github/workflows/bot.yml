name: bot
on: workflow_dispatch
concurrency:
  group: bot-runner
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q requests websocket-client
      - name: run bot then chain next run
        env:
          QQ_APPID: ${{ secrets.QQ_APPID }}
          QQ_SECRET: ${{ secrets.QQ_SECRET }}
          INTERN_KEY: ${{ secrets.INTERN_KEY }}
          ZHIPU_KEY: ${{ secrets.ZHIPU_KEY }}
          GHP_TOKEN: ${{ secrets.GHP_TOKEN }}
        run: |
          timeout 20600 python -u bot.py
          RC=$?
          echo "bot exited rc=$RC (124 = full run)"
          sleep 60
          curl -s -X POST -H "Authorization: Bearer $GHP_TOKEN" -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/qq416423-eng/qq-nvpu/actions/workflows/bot.yml/dispatches \
            -d '{"ref":"main"}'
