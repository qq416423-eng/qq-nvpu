name: watchdog
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: |
          ALIVE=$(curl -s -H "Authorization: Bearer $GHP_TOKEN" "https://api.github.com/repos/qq416423-eng/qq-nvpu/actions/workflows/bot.yml/runs?per_page=1" | python3 -c "import sys,json; r=json.load(sys.stdin)['workflow_runs'][0]; print(r['status'])")
          echo "latest bot run: $ALIVE"
          if [ "$ALIVE" != "in_progress" ] && [ "$ALIVE" != "queued" ]; then
            echo "bot DOWN - restarting"
            sleep 30
            curl -s -X POST -H "Authorization: Bearer $GHP_TOKEN" -H "Accept: application/vnd.github+json"               https://api.github.com/repos/qq416423-eng/qq-nvpu/actions/workflows/bot.yml/dispatches -d '{"ref":"main"}'
            echo restarted
          else
            echo "bot alive"
          fi
        env:
          GHP_TOKEN: ${{ secrets.GHP_TOKEN }}
